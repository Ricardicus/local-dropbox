server {
  listen 80;
  server_name brfrynningeasen.se www.brfrynningeasen.se;

  # Certbot on .150 writes here; challenges from .197 fall back to its server.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri @brf_backend_challenge;
  }

  location @brf_backend_challenge {
    proxy_pass http://192.168.1.197:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_connect_timeout 10s;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name brfrynningeasen.se www.brfrynningeasen.se;

  ssl_certificate /etc/letsencrypt/live/brfrynningeasen.se/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/brfrynningeasen.se/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  location / {
    proxy_pass https://192.168.1.197:443;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_ssl_server_name on;
    proxy_ssl_name $host;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
  }
}
